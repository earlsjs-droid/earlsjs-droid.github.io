<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kingfisher Run</title>
<meta name="description" content="Kingfisher Run: Golden Hour Edition, an iPhone game by J.S. Earls.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2f31;--paper:#f6efe2;--line:#d9ccb4;--accent:#b5562a;--soft:#4c5f60}
@media (prefers-color-scheme:dark){:root{--ink:#f1e8d8;--paper:#10201f;--line:#2f4544;--accent:#f0a86a;--soft:#b7c4c2}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 Karla,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:56px 20px 72px}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font:400 clamp(34px,7vw,46px)/1.1 Marcellus,Georgia,serif;margin:0 0 10px;text-wrap:balance}
.lede{font-size:20px;line-height:1.5;margin:18px 0 8px}
.date{color:var(--soft);font-size:15px;margin:0 0 36px}
h2{font:400 24px/1.25 Marcellus,Georgia,serif;margin:36px 0 8px;padding-top:24px;border-top:1px solid var(--line)}
p,li{margin:0 0 12px}
ul{padding-left:1.2em;margin:0 0 12px}
a{color:var(--accent)}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--soft);font-size:15px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">J.S. Earls</p>
  <h1>Kingfisher Run</h1>
  <p class="lede">Golden Hour Edition. Fly a kingfisher down four rivers, from a spring dawn to a winter night. For iPhone.</p>
  <h2>Pages</h2>
  <ul>
    <li><a href="support/">Support</a></li>
    <li><a href="privacy/">Privacy policy</a></li>
  </ul>
  <footer>Contact: <a href="mailto:earls.js@gmail.com">earls.js@gmail.com</a></footer>
</main>
</body>
</html>
